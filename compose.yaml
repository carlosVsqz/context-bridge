name: context-bridge
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: contextbridge
      POSTGRES_USER: ${POSTGRES_USER:-contextbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d contextbridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    shm_size: 128mb
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/contextbridge
      POSTGRES_USER: ${POSTGRES_USER:-contextbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init-env.py first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@contextbridge.local}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python3 scripts/init-env.py first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
